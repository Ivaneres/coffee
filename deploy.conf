# VPS deploy configuration — sourced by deploy-generic.sh
# Copy this file into other projects and adjust values.
# Secrets (DB passwords, SECRET_KEY) are NOT stored here; pass DATABASE_URL
# or let the script provision/resolve them into backend/.env on the server.

# --- Required ---
APP_NAME=espresso-tracker
DOMAIN=coffee.ereshchenko.com
SSH_HOST=root@195.201.98.136
BACKEND_DIR=backend
FRONTEND_DIR=frontend
ENTRYPOINT=main:app
BACKEND_TYPE=asgi                # asgi (FastAPI) | wsgi (Flask)

# --- Optional (defaults shown) ---
# APP_DIR=/var/www/espresso-tracker
PORT=8002
API_PREFIX=/api                  # nginx location; same host as frontend
API_STRIP_PREFIX=false           # true = strip API_PREFIX before proxy_pass
WORKERS=4
SERVICE_DESCRIPTION="Espresso Tracker API"

# Frontend (React / CRA defaults)
FRONTEND_BUILD_DIR=build         # Vite: dist
FRONTEND_BUILD_CMD="npm run build"
FRONTEND_API_ENV_VAR=REACT_APP_API_URL
# FRONTEND_API_URL=              # default: https://$DOMAIN

# Backend packaging
REQUIREMENTS_FILE=requirements.txt

# Database: postgres | none
# postgres resolves DATABASE_URL / existing .env / POSTGRES_* / auto-create
SETUP_DATABASE=postgres
DB_NAME=espresso_tracker
DB_USER=espresso_user
